{% set version = "0.6.0" %}
{% set fastflow_commit = "d476f66ab924d8d122f54b4b90aee00ef979aea8" %}

package:
  name: smspp-project-split
  version: {{ version }}

source:
  # a development snapshot of the umbrella, until {{ version }} is tagged
  - url: https://gitlab.com/api/v4/projects/smspp%2Fsmspp-project/packages/generic/smspp-project/{{ version }}-dev/smspp-project-{{ version }}-dev.tar.gz
    sha256: 11af99d70c62d24dd0e68715a23a61abb56d7e981e44b1f9acd822c4ba94ffd3
  # SMS++ fetches FastFlow at configure time; it is provided here instead, at
  # a fixed commit, for a reproducible build
  - url: https://github.com/fastflow/fastflow/archive/{{ fastflow_commit }}.tar.gz
    sha256: fca23ce672fe12fe7cdbfa6955a982d6eb75816a00d2d97a93deba9b351f9c53
    folder: fastflow

build:
  number: 0

requirements:
  build:
    - {{ compiler('cxx') }}
    - {{ stdlib('c') }}
    - cmake >=3.21
    - make  # [unix]
    - pkgconfig  # [unix]
    - ninja  # [win]
  host:
    - libgomp  # [linux]
    - llvm-openmp   # [unix]
    - llvm-openmp  # [win and mpi != "msmpi"]
    - intel-openmp  # [win and mpi == "msmpi"]
    - openblas
    - libboost-devel
    - libboost-mpi >={{ libboost_devel }}
    - netcdf-cxx4
    - netcdf-cxx4 * nompi_*
    - libnetcdf
    - libnetcdf * nompi_*
    - hdf5
    - hdf5 * nompi_*
    - libaec  # [unix]
    - openssl  # [unix]
    - libcurl  # [unix]
    - bzip2
    - zlib
    - eigen
    - {{ mpi }}
    - coin-or-utils
    - coin-or-clp
    - coin-or-osi
    - highs >=1.10.0
    - lemon
    - libsvm
    - stopt >=6.3  # [win]
    - stopt >=5.16  # [unix]
    - getopt-win32  # [win]
    - mkl-devel  # [win]
    - zstd  # [win]
    - winpthreads-devel  # [win and mpi != "msmpi"]
    - pthreads-win32  # [win and mpi == "msmpi"]

outputs:
  # the library of each module, installed from the build of the umbrella
  - name: libsmspp
    script: install-module.sh  # [unix]
    script: install-module.bat  # [win]
    build:
      script_env:
        - SMSPP_MODULES=SMS++
      run_exports:
        - {{ pin_subpackage('libsmspp', max_pin='x.x.x') }}
    requirements:
      build:
        - {{ compiler('cxx') }}
        - {{ stdlib('c') }}
        - cmake >=3.21
      host:
        - libboost-devel
        - eigen
        - netcdf-cxx4
        - netcdf-cxx4 * nompi_*
        - libnetcdf
        - libnetcdf * nompi_*
        - hdf5
        - hdf5 * nompi_*
    test:
      commands:
        - test -f ${PREFIX}/lib/cmake/SMS++/SMS++Config.cmake  # [unix]
        - if not exist %LIBRARY_PREFIX%\lib\cmake\SMS++\SMS++Config.cmake exit 1  # [win]

  - name: libsmspp-binaryknapsackblock
    script: install-module.sh  # [unix]
    script: install-module.bat  # [win]
    build:
      script_env:
        - SMSPP_MODULES=BinaryKnapsackBlock
      run_exports:
        - {{ pin_subpackage('libsmspp-binaryknapsackblock', max_pin='x.x.x') }}
    requirements:
      build:
        - {{ compiler('cxx') }}
        - {{ stdlib('c') }}
        - cmake >=3.21
      host:
        - {{ pin_subpackage('libsmspp', exact=True) }}
        - libgomp  # [linux]
        - llvm-openmp  # [osx]
      run:
        - {{ pin_subpackage('libsmspp', exact=True) }}
    test:
      commands:
        - test -f ${PREFIX}/lib/cmake/BinaryKnapsackBlock/BinaryKnapsackBlockConfig.cmake  # [unix]
        - if not exist %LIBRARY_PREFIX%\lib\cmake\BinaryKnapsackBlock\BinaryKnapsackBlockConfig.cmake exit 1  # [win]

