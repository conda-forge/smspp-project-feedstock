{% set version = "0.7.0.dev" %}
{% set build = 0 %}
{% set mpi_label = mpi|replace("-devel", "") %}
{% set fastflow_commit = "d476f66ab924d8d122f54b4b90aee00ef979aea8" %}

package:
  name: smspp-project-split
  version: {{ version }}

source:
  # the tip of develop, submodules included, until the release is tagged:
  # then the tarball of the registry and its sha256 come back here
  - git_url: https://gitlab.com/smspp/smspp-project
    git_rev: develop
  # SMS++ fetches FastFlow at configure time; it is provided here instead, at
  # a fixed commit, for a reproducible build
  - url: https://github.com/fastflow/fastflow/archive/{{ fastflow_commit }}.tar.gz
    sha256: fca23ce672fe12fe7cdbfa6955a982d6eb75816a00d2d97a93deba9b351f9c53
    folder: fastflow

build:
  number: {{ build }}

requirements:
  build:
    - {{ compiler('cxx') }}
    - {{ stdlib('c') }}
    - cmake >=3.21
    - make  # [unix]
    - pkgconfig  # [unix]
    - ninja  # [win]
    # MILPSolver builds a native generator of the HiGHS parameter headers
    # when cross-compiling
    - highs >=1.10.0  # [build_platform != target_platform]
    - impi-devel >=2021.18  # [win and mpi == "impi-devel"]
  host:
    - libgomp  # [linux]
    - llvm-openmp   # [unix]
    - llvm-openmp  # [win and mpi == "impi-devel"]
    - intel-openmp  # [win and mpi == "msmpi"]
    - libboost-devel
    - libboost-mpi >={{ libboost_devel }}
    - netcdf-cxx4
    - netcdf-cxx4 * nompi_*
    - libnetcdf
    - libnetcdf * nompi_*
    - hdf5
    - hdf5 * nompi_*
    - libaec  # [unix]
    - openssl  # [unix]
    - libcurl  # [unix]
    - bzip2
    - zlib
    - eigen
    - {{ mpi }}  # [not win]
    - msmpi  # [win and mpi == "msmpi"]
    - impi-devel >=2021.18  # [win and mpi == "impi-devel"]
    - highs >=1.10.0
    - lemon
    - libsvm
    - stopt >=6.3 mpi_msmpi_*  # [win and mpi == "msmpi"]
    - stopt >=6.3 mpi_impi_*  # [win and mpi == "impi-devel"]
    - stopt >=5.16  # [unix]
    - getopt-win32  # [win]
    - zstd  # [win]
    - winpthreads-devel  # [win and mpi == "impi-devel"]
    - pthreads-win32  # [win and mpi == "msmpi"]

outputs:
  # written by gen_meta.py: edit its tables, not these lines
  # the library of each module, installed from the build of the umbrella
  - name: libsmspp
    script: install-module.sh  # [unix]
    script: install-module.bat  # [win]
    build:
      string: mpi_{{ mpi_label }}_h{{ PKG_HASH }}_{{ build }}
      script_env:
        - SMSPP_MODULES=SMS++
      run_exports:
        - {{ pin_subpackage('libsmspp', max_pin='x.x.x') }}
    requirements:
      build:
        - {{ compiler('cxx') }}
        - {{ stdlib('c') }}
        - cmake >=3.21
      host:
        - libboost-devel
        - eigen
        - netcdf-cxx4
        - netcdf-cxx4 * nompi_*
        - libnetcdf
        - libnetcdf * nompi_*
        - hdf5
        - hdf5 * nompi_*
        - libaec  # [unix]
        - openssl  # [unix]
        - libcurl  # [unix]
        - zlib
        - getopt-win32  # [win]
    test:
      commands:
        - test -f ${PREFIX}/lib/cmake/SMS++/SMS++Config.cmake  # [unix]
        - if not exist %LIBRARY_PREFIX%\lib\cmake\SMS++\SMS++Config.cmake exit 1  # [win]

  - name: libsmspp-bkb
