{% set version = "0.6.0" %}
{% set fastflow_commit = "d476f66ab924d8d122f54b4b90aee00ef979aea8" %}

package:
  name: smspp-project-split
  version: {{ version }}

source:
  # a development snapshot of the umbrella, until {{ version }} is tagged
  - url: https://gitlab.com/api/v4/projects/smspp%2Fsmspp-project/packages/generic/smspp-project/{{ version }}-dev/smspp-project-{{ version }}-dev.tar.gz
    sha256: ce5e185bdcf12de75ce3d6b01a92f0588a3f29a594b496630900a29bab6581b6
  # SMS++ fetches FastFlow at configure time; it is provided here instead, at
  # a fixed commit, for a reproducible build
  - url: https://github.com/fastflow/fastflow/archive/{{ fastflow_commit }}.tar.gz
    sha256: fca23ce672fe12fe7cdbfa6955a982d6eb75816a00d2d97a93deba9b351f9c53
    folder: fastflow

build:
  number: 0

requirements:
  build:
    - {{ compiler('cxx') }}
    - {{ stdlib('c') }}
    - cmake >=3.21
    - make  # [unix]
    - pkgconfig  # [unix]
    - ninja  # [win]
    # MILPSolver builds a native generator of the HiGHS parameter headers
    # when cross-compiling
    - highs >=1.10.0  # [build_platform != target_platform]
  host:
    - libgomp  # [linux]
    - llvm-openmp   # [unix]
    - llvm-openmp  # [win and mpi != "msmpi"]
    - intel-openmp  # [win and mpi == "msmpi"]
    - openblas
    - libboost-devel
    - libboost-mpi >={{ libboost_devel }}
    - netcdf-cxx4
    - netcdf-cxx4 * nompi_*
    - libnetcdf
    - libnetcdf * nompi_*
    - hdf5
    - hdf5 * nompi_*
    - libaec  # [unix]
    - openssl  # [unix]
    - libcurl  # [unix]
    - bzip2
    - zlib
    - eigen
    - {{ mpi }}
    - coin-or-utils
    - coin-or-clp
    - coin-or-osi
    - highs >=1.10.0
    - lemon
    - libsvm
    - stopt >=6.3  # [win]
    - stopt >=5.16  # [unix]
    - getopt-win32  # [win]
    - mkl-devel  # [win]
    - zstd  # [win]
    - winpthreads-devel  # [win and mpi != "msmpi"]
    - pthreads-win32  # [win and mpi == "msmpi"]

outputs:
  # written by gen_meta.py: edit its tables, not these lines
  # the library of each module, installed from the build of the umbrella
  - name: libsmspp
    script: install-module.sh  # [unix]
    script: install-module.bat  # [win]
    build:
      script_env:
        - SMSPP_MODULES=SMS++
      run_exports:
        - {{ pin_subpackage('libsmspp', max_pin='x.x.x') }}
    requirements:
      build:
        - {{ compiler('cxx') }}
        - {{ stdlib('c') }}
        - cmake >=3.21
      host:
        - libboost-devel
        - eigen
        - netcdf-cxx4
        - netcdf-cxx4 * nompi_*
        - libnetcdf
        - libnetcdf * nompi_*
        - hdf5
        - hdf5 * nompi_*
        - libaec  # [unix]
        - openssl  # [unix]
        - libcurl  # [unix]
        - zlib
        - getopt-win32  # [win]
    test:
      commands:
        - test -f ${PREFIX}/lib/cmake/SMS++/SMS++Config.cmake  # [unix]
        - if not exist %LIBRARY_PREFIX%\lib\cmake\SMS++\SMS++Config.cmake exit 1  # [win]

  - name: libsmspp-bkb
    script: install-module.sh  # [unix]
    script: install-module.bat  # [win]
    build:
