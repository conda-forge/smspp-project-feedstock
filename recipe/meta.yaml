        - cmake >=3.21
      host:
        - {{ pin_subpackage('libsmspp', exact=True) }}
        - libgomp  # [linux]
        - llvm-openmp  # [osx]
        - libboost-devel
        - eigen
        - netcdf-cxx4
        - netcdf-cxx4 * nompi_*
        - libnetcdf
        - libnetcdf * nompi_*
        - hdf5
        - hdf5 * nompi_*
        - libaec  # [unix]
        - openssl  # [unix]
        - libcurl  # [unix]
        - zlib
        - getopt-win32  # [win]
      run:
        - {{ pin_subpackage('libsmspp', exact=True) }}
    test:
